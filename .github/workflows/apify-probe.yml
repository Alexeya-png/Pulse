name: Temporary Apify fallback schema probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect selected fallback schemas
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          def get(url):
              with urlopen(url, timeout=30) as r:
                  return json.load(r)

          for actor in [
              "scrapesmith~instagram-followers-following-scraper",
              "danek~instagram-followers-following-scraper",
          ]:
              print("\n=== ACTOR", actor, "===")
              meta = get(f"https://api.apify.com/v2/acts/{actor}")["data"]
              latest = meta.get("taggedBuilds", {}).get("latest", {})
              print("META", json.dumps({
                  "id": meta.get("id"),
                  "stats": meta.get("stats"),
                  "pricingInfos": meta.get("pricingInfos"),
                  "latest": latest,
              }, ensure_ascii=False))
              build_id = latest.get("buildId")
              build = get(f"https://api.apify.com/v2/actor-builds/{build_id}")["data"]
              print("INPUT_SCHEMA", build.get("inputSchema"))
              print("README", (build.get("readme") or "")[:20000])
          PY
