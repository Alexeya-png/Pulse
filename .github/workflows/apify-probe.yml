name: Temporary scraping-solutions schema probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect scraping-solutions contracts
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          def get(url):
              with urlopen(url, timeout=30) as r:
                  return json.load(r)

          for actor in [
              "scraping_solutions~instagram-scraper-followers-following",
              "scraping_solutions~instagram-scraper-followers-following-no-cookies",
          ]:
              print("\n=== ACTOR", actor, "===")
              meta = get(f"https://api.apify.com/v2/acts/{actor}")["data"]
              latest = meta.get("taggedBuilds", {}).get("latest", {})
              build = get(f"https://api.apify.com/v2/actor-builds/{latest['buildId']}")["data"]
              print("INPUT_SCHEMA", build.get("inputSchema"))
              print("README", (build.get("readme") or "")[:12000])
          PY
