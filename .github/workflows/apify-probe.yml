name: Temporary Apify actor probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Search Apify Store alternatives
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import urlopen

          for query in [
              "instagram followers following",
              "instagram followers scraper",
              "instagram following scraper",
          ]:
              url = "https://api.apify.com/v2/store?" + urlencode({
                  "search": query,
                  "limit": 30,
                  "offset": 0,
              })
              with urlopen(url, timeout=30) as r:
                  data = json.load(r)
              print("\nQUERY", query)
              items = data.get("data", {}).get("items", [])
              for item in items:
                  out = {
                      "id": item.get("id"),
                      "username": item.get("username"),
                      "name": item.get("name"),
                      "title": item.get("title"),
                      "description": item.get("description"),
                      "stats": item.get("stats"),
                      "pricingInfos": item.get("pricingInfos"),
                      "currentPricingInfo": item.get("currentPricingInfo"),
                  }
                  print(json.dumps(out, ensure_ascii=False))
          PY
