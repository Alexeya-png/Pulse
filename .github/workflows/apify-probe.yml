name: Temporary Apify actor probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect fallback actor metadata
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          from urllib.error import HTTPError

          actor = "scraping_solutions~instagram-scraper-followers-following"
          base = f"https://api.apify.com/v2/acts/{actor}"
          with urlopen(base, timeout=30) as r:
              meta = json.load(r)["data"]
          print("ACTOR", json.dumps({
              "id": meta.get("id"),
              "title": meta.get("title"),
              "description": meta.get("description"),
              "latest": meta.get("taggedBuilds", {}).get("latest"),
              "pricingInfos": meta.get("pricingInfos"),
              "readmeSummary": meta.get("readmeSummary"),
          }, ensure_ascii=False))

          build_id = meta.get("taggedBuilds", {}).get("latest", {}).get("buildId")
          if not build_id:
              raise SystemExit("No latest build")
          with urlopen(f"https://api.apify.com/v2/actor-builds/{build_id}", timeout=30) as r:
              build = json.load(r)["data"]
          print("INPUT_SCHEMA", build.get("inputSchema"))
          print("README", (build.get("readme") or "")[:40000])
          PY
