name: Temporary Apify actor probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect candidate actor schemas
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          actors = [
              "apify~instagram-followers-following-scraper",
              "coderx~instagram-followers-following-scraper-no-cookies-login",
              "dami_studio~instagram-followers-following-scraper",
          ]
          for actor in actors:
              print("\n=== ACTOR", actor, "===")
              with urlopen(f"https://api.apify.com/v2/acts/{actor}", timeout=30) as r:
                  meta = json.load(r)["data"]
              latest = meta.get("taggedBuilds", {}).get("latest", {})
              print("META", json.dumps({
                  "id": meta.get("id"),
                  "latest": latest,
                  "currentPricingInfo": meta.get("currentPricingInfo"),
              }, ensure_ascii=False))
              build_id = latest.get("buildId")
              if build_id:
                  with urlopen(f"https://api.apify.com/v2/actor-builds/{build_id}", timeout=30) as r:
                      build = json.load(r)["data"]
                  print("INPUT_SCHEMA", build.get("inputSchema"))
                  print("DATASET_SCHEMA", build.get("datasetSchema"))
                  print("README", (build.get("readme") or "")[:25000])
          PY
