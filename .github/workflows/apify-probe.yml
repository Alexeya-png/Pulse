name: Temporary Apify actor probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apify-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect actor input schema endpoints
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          from urllib.error import HTTPError

          urls = [
            "https://api.apify.com/v2/actor-builds/3hrzbUnfzJoeNpQoo",
            "https://api.apify.com/v2/actor-builds/3hrzbUnfzJoeNpQoo/input-schema",
            "https://api.apify.com/v2/acts/scraping_solutions~instagram-scraper-followers-following-no-cookies/builds/latest",
            "https://api.apify.com/v2/acts/scraping_solutions~instagram-scraper-followers-following-no-cookies/versions/0.0/input-schema",
          ]
          for url in urls:
              print("\nURL", url)
              try:
                  with urlopen(url, timeout=30) as r:
                      raw = r.read().decode("utf-8", "replace")
                  print(raw[:50000])
              except HTTPError as e:
                  print("HTTP", e.code, e.read().decode("utf-8", "replace")[:3000])
              except Exception as e:
                  print(type(e).__name__, str(e))
          PY
